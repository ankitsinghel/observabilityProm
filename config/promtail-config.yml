server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push   # <-- This is required

scrape_configs:

  # --- SCRAPE DOCKER CONTAINER LOGS ---
  - job_name: "docker-logs"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "docker"
          __path__: "/var/lib/docker/containers/*/*.log"

  # --- SCRAPE NODE APP LOGS ---
  - job_name: "node-app-logs"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "node-app"
          app: "node-app"
          __path__: "/var/log/node-app/*.log"

  # --- SCRAPE SYSTEM LOGS ---
  - job_name: "varlogs"
    static_configs:
      - targets: ["localhost"]
        labels:
          job: "varlogs"
          __path__: "/var/log/*.log"
